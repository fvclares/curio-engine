name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Preparar site estático (sem node_modules/tools)
        run: |
          mkdir -p _site
          rsync -av --exclude 'node_modules' --exclude 'tools' --exclude '.github' \
            --exclude '_site' --exclude '.git' ./ _site/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
